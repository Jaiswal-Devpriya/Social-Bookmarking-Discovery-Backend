services:
  postgres:
    image: postgres:16
    container_name: social_postgres
    environment:
      POSTGRES_DB: social_bookmarks
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: social_redis
    ports:
      - "6379:6379"